# Corre los agentes de Enci-Intel todos los dias. Render gratis duerme el backend, asi que el cron interno (APScheduler)
# no dispara mientras duerme: esta llamada lo despierta y lanza la corrida.
# Secretos del repo: INTEL_API_URL (p. ej. https://encipharm-intel-api.onrender.com) e INTEL_SERVICE_API_KEY.
name: Agentes Enci-Intel

on:
  schedule:
    - cron: "10 11 * * *"  # 11:10 UTC = 08:10 en Chile (verano)
  workflow_dispatch:

jobs:
  correr:
    runs-on: ubuntu-latest
    if: ${{ vars.AGENTES_ACTIVOS != 'false' }}
    strategy:
      max-parallel: 1
      matrix:
        agente: [agente_sag, agente_competidores]
    steps:
      - name: Despertar el backend y lanzar ${{ matrix.agente }}
        env:
          INTEL_API_URL: ${{ secrets.INTEL_API_URL }}
          INTEL_SERVICE_API_KEY: ${{ secrets.INTEL_SERVICE_API_KEY }}
        run: |
          test -n "$INTEL_API_URL" && test -n "$INTEL_SERVICE_API_KEY" || { echo "Faltan los secretos INTEL_API_URL / INTEL_SERVICE_API_KEY"; exit 1; }
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 "$INTEL_API_URL/health" > /dev/null
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 -X POST \
            -H "X-API-Key: $INTEL_SERVICE_API_KEY" \
            "$INTEL_API_URL/api/v1/agents/${{ matrix.agente }}/run"
